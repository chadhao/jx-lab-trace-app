# 内网 CI 入口：http://192.168.10.50:3010 （Gitea Actions · 宿主执行 labels: ubuntu-latest）
# 与 .github/workflows/android.yml 双通道并存：GitHub Actions 走 .github/，Gitea 优先读 .gitea/。
# 全 run: 步骤（内网拉不到 actions/*，禁止 container:），服务器环境按任务包 JDK17/AndroidSDK 宿主路径。
name: android

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /home/chadhao/ci/jdk17
      ANDROID_HOME: /home/chadhao/ci/android-sdk
    steps:
      - name: Checkout（git clone，无 actions/checkout）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Gitea 注入 GITEA_* / GITHUB_* 两套变量名均兼容；实测名回执注明
          SERVER_URL="${GITEA_SERVER_URL:-${GITHUB_SERVER_URL:-http://192.168.10.50:3010}}"
          REPOSITORY="${GITEA_REPOSITORY:-${GITHUB_REPOSITORY:-chadhao/jx-lab-trace-app}}"
          REF_NAME="${GITEA_REF_NAME:-${GITHUB_REF_NAME:-main}}"
          SHA="${GITEA_SHA:-${GITHUB_SHA:-}}"
          HOST_PATH="${SERVER_URL#*://}"
          echo "env: SERVER_URL=$SERVER_URL REPOSITORY=$REPOSITORY REF_NAME=$REF_NAME SHA=$SHA"
          git clone --depth 1 --branch "$REF_NAME" "http://x-access-token:${TOKEN}@${HOST_PATH}/${REPOSITORY}.git" repo
          cd repo
          git checkout "$SHA" || { git fetch --depth 50 origin "$REF_NAME"; git checkout "$SHA"; }
          echo "checked out: $(git rev-parse HEAD)"

      - name: SDK 预检（接受许可 + 补装 compileSdk 35）
        # 任务包环境表只列了 android-34/build-tools34 且许可未接受；本工程 compileSdk=35，
        # 首跑败于 "licences have not been accepted"（run3/run4 实证）——在此幂等补齐。
        run: |
          set -euo pipefail
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          # 服务器暂存的 cmdline-tools 丢失执行位（run5: Permission denied），先修复
          chmod +x "$ANDROID_HOME"/cmdline-tools/latest/bin/* 2>/dev/null || true
          chmod +x "$ANDROID_HOME"/platform-tools/* 2>/dev/null || true
          # pipefail 下 yes 会收 SIGPIPE（141），许可步骤允许非零；以下安装步骤做功能性兜底
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Build（assembleDebug + 单测 + lint）
        run: |
          set -euo pipefail
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          java -version
          cd repo/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Gates（三门禁）
        run: |
          set -euo pipefail
          cd repo
          python3 scripts/check_tokens.py
          python3 scripts/check_colors.py
          python3 scripts/check_scope.py

      - name: Publish APK 到服务器产出目录
        run: |
          set -euo pipefail
          mkdir -p /srv/jx-lab-trace/ci/apk
          cp repo/android/app/build/outputs/apk/debug/app-debug.apk /srv/jx-lab-trace/ci/apk/app-debug-latest.apk
          ls -l /srv/jx-lab-trace/ci/apk/app-debug-latest.apk
          echo "APK 产出: /srv/jx-lab-trace/ci/apk/app-debug-latest.apk"
          echo "Gitea: ${GITEA_SERVER_URL:-${GITHUB_SERVER_URL}}/${GITEA_REPOSITORY:-${GITHUB_REPOSITORY}}/actions/runs/${GITEA_RUN_ID:-${GITHUB_RUN_ID}}"

      - name: Release（apk-latest 删旧重建 + 上传 APK · Gitea API）
        # MIMO-TASK-S02-NAV 追加：构建成功后自动发布；删旧 404 = 首跑正常跳过；
        # 其余失败（含 401/403 权限不足）一律标红（产物发布是交付的一部分）。
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SERVER_URL="${GITEA_SERVER_URL:-${GITHUB_SERVER_URL:-http://192.168.10.50:3010}}"
          REPOSITORY="${GITEA_REPOSITORY:-${GITHUB_REPOSITORY:-chadhao/jx-lab-trace-app}}"
          REF_NAME="${GITEA_REF_NAME:-${GITHUB_REF_NAME:-main}}"
          SHA="${GITEA_SHA:-${GITHUB_SHA:-}}"
          SHORT="${SHA:0:7}"
          API="$SERVER_URL/api/v1"
          APK=repo/android/app/build/outputs/apk/debug/app-debug.apk
          AUTH="Authorization: token $TOKEN"
          test -n "$TOKEN" || { echo "GITHUB_TOKEN 未注入"; exit 1; }
          test -f "$APK" || { echo "APK 产物缺失: $APK"; exit 1; }

          # ① 删旧：GET by tag → 200 则 DELETE；404 跳过（首跑）；其余标红（权限/服务异常）
          CODE=$(curl -sS -o /tmp/rel_old.json -w '%{http_code}' -H "$AUTH" \
            "$API/repos/$REPOSITORY/releases/tags/apk-latest")
          if [ "$CODE" = "200" ]; then
            REL_ID=$(python3 -c "import json;print(json.load(open('/tmp/rel_old.json'))['id'])")
            DEL=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$AUTH" \
              "$API/repos/$REPOSITORY/releases/$REL_ID")
            echo "delete old release id=$REL_ID → HTTP $DEL"
            { [ "$DEL" = "204" ] || [ "$DEL" = "200" ]; } \
              || { echo "删除旧 Release 失败 HTTP $DEL（权限不足则按任务包写 BLOCKED）"; exit 1; }
          elif [ "$CODE" = "404" ]; then
            echo "apk-latest 无既有 Release（首跑跳过删除）"
          else
            echo "查询旧 Release 失败 HTTP $CODE（401/403 = token 权限不足 → 回执 BLOCKED）"
            cat /tmp/rel_old.json
            exit 1
          fi

          # ② 重建：body 含构建 commit 短号
          BODY=$(printf '{"tag_name":"apk-latest","name":"apk-latest","body":"jx-lab-trace-app debug APK · commit %s · run %s","target_commitish":"%s"}' \
            "$SHORT" "${GITEA_RUN_ID:-${GITHUB_RUN_ID:-0}}" "$REF_NAME")
          NEW=$(curl -sS -o /tmp/rel_new.json -w '%{http_code}' -X POST -H "$AUTH" \
            -H "Content-Type: application/json" -d "$BODY" \
            "$API/repos/$REPOSITORY/releases")
          [ "$NEW" = "201" ] || { echo "创建 Release 失败 HTTP $NEW"; cat /tmp/rel_new.json; exit 1; }
          REL_ID=$(python3 -c "import json;print(json.load(open('/tmp/rel_new.json'))['id'])")

          # ③ 上传资产（multipart attachment 字段）
          UP=$(curl -sS -o /tmp/rel_asset.json -w '%{http_code}' -X POST -H "$AUTH" \
            -F "attachment=@$APK" \
            "$API/repos/$REPOSITORY/releases/$REL_ID/assets?name=jx-lab-trace-debug.apk")
          [ "$UP" = "201" ] || { echo "上传 Release 资产失败 HTTP $UP"; cat /tmp/rel_asset.json; exit 1; }
          echo "Release apk-latest 已更新：id=$REL_ID commit=$SHORT run=${GITEA_RUN_ID:-${GITHUB_RUN_ID:-0}}"
          python3 -c "import json;a=json.load(open('/tmp/rel_asset.json'));print('asset:',a.get('name'),a.get('size'))"
