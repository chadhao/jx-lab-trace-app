name: android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK + unit tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest 2>&1 | tee ../build.log

      - name: Upload build log (always, for acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Push build log to ci/logs branch (failure only)
        if: failure()
        run: |
          git config user.email "ci-bot@example.local"
          git config user.name "ci-bot"
          git fetch origin main --depth=1
          git checkout -B ci/logs origin/main
          cp build.log ./build.log 2>/dev/null || true
          git add build.log
          git commit -m "ci: build log for ${GITHUB_SHA}" || true
          git push origin ci/logs

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Check design tokens consistency
        run: python3 scripts/check_tokens.py
