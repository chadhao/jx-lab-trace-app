name: android

# 2026-10-21 起停用自动触发（内网 Gitea CI = .gitea/ 是唯一通道；GitHub 仅保留手动备份）。
# 永不自动触发：仅 workflow_dispatch 手动点击运行。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK + unit tests + lint
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew lintDebug assembleDebug testDebugUnitTest 2>&1 | tee ../build.log || {
            grep "^e: " ../build.log | head -60 | while IFS= read -r l; do echo "::error $l"; done
            exit 1
          }

      - name: Upload test-results XML (always, for acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build log (always, for acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Push build log to ci/logs branch (failure only)
        if: failure()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci-bot@example.local"
          git config user.name "ci-bot"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/chadhao/jx-lab-trace-app.git"
          git fetch origin main
          git checkout -B ci/logs origin/main
          git add build.log
          git commit -m "ci: build log for ${GITHUB_SHA}" || true
          git push -f origin ci/logs

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Check design tokens consistency
        run: python3 scripts/check_tokens.py

      - name: Check no hardcoded colors (J4)
        run: python3 scripts/check_colors.py

      - name: Check PC-only whitelist scope (M13-1)
        run: python3 scripts/check_scope.py
